name: CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build services
        run: |
          ./gradlew \
            :services:eureka-server:bootJar \
            :services:config-server:bootJar \
            :services:gateway:bootJar \
            :services:user-service:bootJar \
            :services:drop-service:bootJar \
            :services:order-service:bootJar \
            :services:product-service:bootJar \
            :services:payment-service:bootJar \
            :services:raffle-service:bootJar \
            :services:coupon-service:bootJar \
            :services:notification-service:bootJar \
            -x test --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push eureka-server
        uses: docker/build-push-action@v5
        with:
          context: ./services/eureka-server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-eureka-server:latest

      - name: Build & Push config-server
        uses: docker/build-push-action@v5
        with:
          context: ./services/config-server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-config-server:latest

      - name: Build & Push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-gateway:latest

      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-user-service:latest

      - name: Build & Push drop-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/drop-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-drop-service:latest

      - name: Build & Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-order-service:latest

      - name: Build & Push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-product-service:latest

      - name: Build & Push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-payment-service:latest

      - name: Build & Push raffle-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/raffle-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-raffle-service:latest

      - name: Build & Push coupon-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/coupon-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-coupon-service:latest

      - name: Build & Push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/omc-notification-service:latest

  check-ec2:
    name: Check EC2 Availability
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      reachable: ${{ steps.check.outputs.reachable }}

    steps:
      - name: Check EC2 SSH port
        id: check
        run: |
          if nc -z -w 5 ${{ secrets.EC2_HOST }} 22 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "EC2 is reachable, proceeding with deploy"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "EC2 is not reachable, skipping deploy"
          fi

  deploy:
    name: Deploy to 3-Tier Multi-EC2
    runs-on: ubuntu-latest
    needs: check-ec2
    if: needs.check-ec2.outputs.reachable == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2 Edge (1호기)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.*.yml,infra/deploy/*.sh,docker/nginx/default.conf,docker/keycloak/**,docker/postgres/init/**,docker/prometheus/prometheus.yml,docker/loki/loki-config.yml,docker/promtail/promtail-config.yml"
          target: "~/omc"

      - name: Run deploy scripts on EC2 Edge (1호기)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/omc
            
            # 원격 1호기 내부에서 2호기(WAS), 3호기(Infra)에 접속할 비밀키 보관
            mkdir -p ~/.ssh
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # GITHUB_OWNER 주입을 위해 소문자 변환 값 전달
            export GITHUB_OWNER="${{ env.OWNER_LC }}"
            
            # AWS 인프라 프라이빗 IP 환경변수 주입
            export EDGE_IP="${{ secrets.EC2_HOST }}"
            export WAS_IP="${{ secrets.EC2_WAS_PRIVATE_IP }}"
            export INFRA_IP="${{ secrets.EC2_INFRA_PRIVATE_IP }}"
            export EDGE_HOST_IP="${{ secrets.EC2_EDGE_PRIVATE_IP }}"
            export INFRA_HOST_IP="${{ secrets.EC2_INFRA_PRIVATE_IP }}"
            
            # 보안 환경 변수 주입
            export KEYCLOAK_ADMIN="${{ secrets.KEYCLOAK_ADMIN }}"
            export KEYCLOAK_ADMIN_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export GATEWAY_SECRET="${{ secrets.GATEWAY_SECRET }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export TOSS_SECRET_KEY="${{ secrets.TOSS_SECRET_KEY }}"
            export SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"

            # 실행 권한 부여 및 기동
            chmod +x infra/deploy/*.sh

            echo "=== [3호기 Infra] 배포 시작 ==="
            ./infra/deploy/deploy-infra.sh

            echo "=== [2호기 WAS] 배포 시작 ==="
            ./infra/deploy/deploy-was.sh

            echo "=== [1호기 Edge] 배포 시작 ==="
            ./infra/deploy/deploy-edge.sh
