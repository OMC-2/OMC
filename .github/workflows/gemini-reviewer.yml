name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            
            // 1. 코딩 컨벤션 문서 읽기
            let convention = '';
            try {
              if (fs.existsSync('docs/CONVENTION.md')) {
                convention = fs.readFileSync('docs/CONVENTION.md', 'utf8');
                console.log('docs/CONVENTION.md 파일을 성공적으로 읽었습니다.');
              } else {
                console.log('docs/CONVENTION.md 파일이 존재하지 않습니다.');
              }
            } catch (e) {
              console.error('docs/CONVENTION.md 파일을 읽는 중 오류 발생:', e);
            }

            // 2. PR Diff 가져오기
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            
            console.log(`PR #${pull_number}의 Diff를 가져옵니다.`);
            const diffResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
              mediaType: {
                format: 'diff'
              }
            });
            let diff = diffResponse.data;

            // 너무 큰 Diff 방어 (예: 60,000자 초과 시 API 소켓 끊김 방지)
            const MAX_DIFF_LENGTH = 60000;
            if (diff.length > MAX_DIFF_LENGTH) {
              console.log(`Diff 사이즈가 너무 큽니다(${diff.length}자). ${MAX_DIFF_LENGTH}자로 제한합니다.`);
              diff = diff.substring(0, MAX_DIFF_LENGTH) + "\n\n... (⚠️ Diff가 너무 길어 API 안정성을 위해 이후 내용은 생략되었습니다) ...";
            }

            // 3. 제미나이에게 전달할 프롬프트 생성
            const prompt = `
            당신은 OMC 프로젝트의 시니어 백엔드 개발자이자 엄격한 코드 리뷰어입니다.
            
            다음은 우리 프로젝트의 코딩 컨벤션(docs/CONVENTION.md)입니다:
            <convention>
            ${convention}
            </convention>
            
            다음은 이번 PR의 코드 변경 사항(diff)입니다:
            <diff>
            ${diff}
            </diff>
            
            지시사항:
            반드시 다음 2가지를 포함하여 리뷰를 작성해주세요. 응답은 무조건 한국어(Korean)로만 작성해야 합니다.
            
            1. **PR 요약**: 이 PR이 어떤 코드를 수정하거나 추가했는지, 그 목적과 내용을 알기 쉽게 한국어로 요약해주세요.
            2. **컨벤션 검토**: PR의 코드 변경 사항 중 위의 <convention> 규칙을 위반한 부분이 있는지 꼼꼼하게 확인해주세요.
               - 위반 사항이 있다면: 어느 파일의 어떤 코드가 문제인지 지적하고, 컨벤션에 맞게 어떻게 수정해야 하는지 구체적인 코드 예시와 함께 알려주세요.
               - 위반 사항이 없다면: "모든 코드가 컨벤션을 잘 준수하고 있습니다."라고 남겨주세요.
               
            친절하면서도 명확한 어조로 작성해주세요.
            `;

            // 4. Gemini API (1.5 Flash) 호출
            console.log('Gemini API를 호출하여 코드 리뷰를 생성합니다...');
            const apiKey = process.env.GEMINI_API_KEY;
            
            if (!apiKey) {
              throw new Error("GEMINI_API_KEY가 설정되지 않았습니다. GitHub Secrets를 확인해주세요.");
            }

            let reviewComment = "";
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  systemInstruction: {
                    parts: [{ text: "당신은 한국어로 리뷰하는 시니어 개발자입니다. 코딩 컨벤션에 매우 엄격합니다." }]
                  }
                })
              });
              
              const result = await response.json();
              if (result.candidates && result.candidates.length > 0) {
                reviewComment = result.candidates[0].content.parts[0].text;
                console.log('Gemini 리뷰 생성 성공.');
              } else {
                console.error('Gemini API Error Response:', JSON.stringify(result, null, 2));
                const errMsg = result.error ? result.error.message : JSON.stringify(result);
                reviewComment = `🚨 제미나이 API가 비정상적인 응답을 반환하여 리뷰를 생성하지 못했습니다.\n\n**에러 상세내용:**\n\`\`\`json\n${errMsg}\n\`\`\``;
              }
            } catch (error) {
              console.error('Gemini API Fetch Error (Network/Socket):', error);
              reviewComment = `🚨 제미나이 API 통신 중 내부 오류가 발생했습니다.\n\n**에러 상세내용:**\n${error.message}`;
            }

            // 5. PR에 코멘트 남기기
            console.log('PR에 리뷰 코멘트를 등록합니다.');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: "## 🤖 Gemini AI 코드 리뷰 결과\n\n" + reviewComment
            });
