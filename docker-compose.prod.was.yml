      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://${INFRA_HOST_IP}:5432/omc?currentSchema=drop_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${INFRA_HOST_IP}
      REDIS_PORT: 6379
      KAFKA_URI: ${INFRA_HOST_IP}:9092
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - omc-network
    deploy:
      resources:
