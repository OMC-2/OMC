services:
  eureka-server:
    image: ghcr.io/${GITHUB_OWNER}/omc-eureka-server:latest
    container_name: omc-eureka-server
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    ports:
      - "8761:8761"
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  config-server:
    image: ghcr.io/${GITHUB_OWNER}/omc-config-server:latest
    container_name: omc-config-server
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    image: ghcr.io/${GITHUB_OWNER}/omc-gateway:latest
    container_name: omc-gateway
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      REDIS_HOST: ${INFRA_HOST_IP}
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://${EDGE_HOST_IP}:8180
      KEYCLOAK_JWKS_URI: http://${EDGE_HOST_IP}:8180/realms/omc/protocol/openid-connect/certs
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://${INFRA_HOST_IP}:9411/api/v2/spans
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  user-service:
    image: ghcr.io/${GITHUB_OWNER}/omc-user-service:latest
    container_name: omc-user-service
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://${INFRA_HOST_IP}:5432/omc?currentSchema=user_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      KEYCLOAK_URL: http://${EDGE_HOST_IP}:8180
      KEYCLOAK_REALM: omc
      KEYCLOAK_CLIENT_ID: omc-client
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  drop-service:
    image: ghcr.io/${GITHUB_OWNER}/omc-drop-service:latest
    container_name: omc-drop-service
    ports:
