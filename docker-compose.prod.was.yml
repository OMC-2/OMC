      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://${INFRA_HOST_IP}:5432/omc?currentSchema=notification_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_URI: ${INFRA_HOST_IP}:9092
