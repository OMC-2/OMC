services:

  eureka-server:
    build:
      context: ./services/eureka-server
    container_name: omc-eureka-server
    ports:
      - "8761:8761"
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  config-server:
    build:
      context: ./services/config-server
    container_name: omc-config-server
    ports:
      - "8888:8888"
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  gateway:
    build:
      context: ./services/gateway
    container_name: omc-gateway
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: local-secret
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/omc/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  user-service:
    build:
      context: ./services/user-service
    container_name: omc-user-service
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      GATEWAY_SECRET: local-secret
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_REALM: omc
      KEYCLOAK_CLIENT_ID: omc-client
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      ADMIN_SECRET: local-admin-secret
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  drop-service:
    build:
      context: ./services/drop-service
    container_name: omc-drop-service
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  order-service:
