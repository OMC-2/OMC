services:

  eureka-server:
    build:
      context: ./services/eureka-server
    container_name: omc-eureka-server
    cpuset: "6-7"        # [격리] noisy neighbor → hot 코어(0-5)에서 분리
    ports:
      - "8761:8761"
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  config-server:
    build:
      context: ./services/config-server
    container_name: omc-config-server
    cpuset: "6-7"        # [격리] noisy neighbor → hot 코어(0-5)에서 분리
    ports:
      - "8888:8888"
    environment:
      TZ: Asia/Seoul
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  gateway:
    build:
      context: ./services/gateway
    container_name: omc-gateway
    # cpuset: "4-5"        # [격리] CPU 격리를 해제하여 부하 시 코어를 모두 쓸 수 있게 함
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: local-secret
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/omc/protocol/openid-connect/certs
      COUPON_TICKET_AES_KEY: ${COUPON_TICKET_AES_KEY:-Y291cG9uLXRpY2tldC1hZXMtMjU2LXNlY3JldC1rZXk=}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xmx1500m -Xms1024m -Xlog:gc*:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=20m"
      TRACING_SAMPLING_PROBABILITY: "0.0"
      MANAGEMENT_TRACING_ENABLED: "false"   # 샘플링 0으로는 Observation 객체 생성이 안 멈춤 → 트레이싱 자체 비활성으로 hot path 할당 제거
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 2G

  user-service:
    build:
      context: ./services/user-service
    container_name: omc-user-service
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      GATEWAY_SECRET: local-secret
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_REALM: omc
      KEYCLOAK_CLIENT_ID: omc-client
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      ADMIN_SECRET: local-admin-secret
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  drop-service:
    build:
      context: ./services/drop-service
    container_name: omc-drop-service
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      SENTRY_DSN: ${SENTRY_DSN:-}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g -XX:+UseG1GC"
      TRACING_SAMPLING_PROBABILITY: 0.0
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 1536m

  order-service:
    build:
      context: ./services/order-service
    container_name: omc-order-service
    ports:
      - "8083:8083"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-key-for-local-dev}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m


  product-service:
    build:
      context: ./services/product-service
    container_name: omc-product-service
    ports:
      - "8084:8084"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  payment-service:
    build:
      context: ./services/payment-service
    container_name: omc-payment-service
    ports:
      - "8085:8085"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      PAYMENT_PG_MODE: ${PAYMENT_PG_MODE:-test}
      TOSS_BASE_URL: ${TOSS_BASE_URL:-http://toss-wiremock:8080}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test-secret-key}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      toss-wiremock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  raffle-service:
    build:
      context: ./services/raffle-service
    container_name: omc-raffle-service
    ports:
      - "8086:8086"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      SENTRY_DSN: ${SENTRY_DSN:-}
      PAYMENT_SERVICE_URL: http://omc-toss-wiremock:8080
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 512m

  coupon-service:
    build:
      context: ./services/coupon-service
    container_name: omc-coupon-service
    cpuset: "0-3"        # [격리] hot 서비스 전용 코어 (가장 큰 CPU 소비처 → 4코어 배정)
    ports:
      - "8087-8088:8087"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      COUPON_TICKET_AES_KEY: ${COUPON_TICKET_AES_KEY:-Y291cG9uLXRpY2tldC1hZXMtMjU2LXNlY3JldC1rZXk=}
      SENTRY_DSN: ${SENTRY_DSN:-}
      KAFKA_MAX_POLL_RECORDS: "50"
      SPRING_KAFKA_LISTENER_CONCURRENCY: "3"
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms1500m -Xmx1500m"
      TRACING_SAMPLING_PROBABILITY: "0.0"
      MANAGEMENT_TRACING_ENABLED: "false"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 2G

  notification-service:
    build:
      context: ./services/notification-service
    container_name: omc-notification-service
    ports:
      - "8089:8088"
    environment:
      TZ: Asia/Seoul
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
      USER_SERVICE_URL: http://user-service:8081
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ZGenerational -XX:ConcGCThreads=2 -Xmx512m -Xms128m"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 360s
    networks:
      - omc-network
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: omc-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - omc-network

networks:
  omc-network:
    external: true
