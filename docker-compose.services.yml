      DB_URL: postgres:5432
      DB_USERNAME: omc
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_URI: kafka:29092
      GATEWAY_SECRET: local-secret
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
