plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.omc'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.5"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.1"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
        testImplementation project(':arch-rules')
    }

    test {
        useJUnitPlatform()
        finalizedBy 'jacocoTestReport'
        doLast {
            // postgres anonymous volumes 정리 (testcontainers 컨테이너는 Ryuk이 이미 제거)
            // 주의: docker-compose down 상태라면 omc_postgres_data 등 named volume도 삭제됨
            ['docker', 'volume', 'prune', '-f'].execute().waitFor()
            ['docker', 'image', 'prune', '-f'].execute().waitFor()
        }
    }

    jacocoTestReport {
        dependsOn test
        reports {
            html.required = true
            xml.required = true
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, includes: [
                    'com/omc/*/presentation/controller/**',
                    'com/omc/*/application/service/**'
                ])
            }))
        }
    }
}

// common 모듈: 일반 jar만 빌드 (bootJar 제외)
project(':common') {
    apply plugin: 'java-library'
    dependencies {
        compileOnly 'io.sentry:sentry:8.13.2'
    }
}

// arch-rules 모듈: 아키텍처 공통 규칙 (일반 jar)
project(':arch-rules') {
    apply plugin: 'java-library'
    dependencies {
        implementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}

// 서비스 모듈 공통 설정 (gateway, eureka-server 제외)
def jpaServiceModules = [
    'user-service', 'product-service', 'drop-service',
    'raffle-service', 'order-service', 'payment-service', 'coupon-service', 'notification-service'
]

configure(subprojects.findAll { it.name in jpaServiceModules }) {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        runtimeOnly 'org.postgresql:postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
        implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:1.0.5'
        implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.13.2'
        implementation project(':common')
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-starter-config'
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                includes = [
                    'com.omc.*.presentation.controller.*',
                    'com.omc.*.application.service.*'
                ]
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
    }
}

// gateway 모듈 설정 (WebFlux 기반 - Spring MVC 불가)
project(':services:gateway') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-starter-config'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
        implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.13.2'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
        implementation(project(':common')) {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
        }
        testImplementation 'io.projectreactor:reactor-test'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
        testImplementation 'org.testcontainers:testcontainers:1.21.3'
    }

    test {
        useJUnitPlatform {
            // CI 환경(GitHub Actions 등)에서만 통합 테스트 제외, 로컬에서는 항상 포함
            if (System.getenv('CI') != null) {
                excludeTags 'integration'
            }
        }
        // TestContainers — Docker Desktop 29.x / API 1.44 호환
        systemProperty "api.version", "1.44"
        environment "DOCKER_API_VERSION", "1.44"
        environment "TESTCONTAINERS_RYUK_DISABLED", "true"

        // Mac Docker Desktop 소켓 자동 감지
        // /var/run/docker.sock 없을 때 Docker Desktop 소켓으로 폴백 (개인 설정 불필요)
        def standardSocket = new File('/var/run/docker.sock')
        def dockerRunSocket = new File("${System.getProperty('user.home')}/.docker/run/docker.sock")
        def macDesktopSocket = new File("${System.getProperty('user.home')}/Library/Containers/com.docker.docker/Data/docker-cli.sock")
        if (!standardSocket.exists()) {
            if (dockerRunSocket.exists()) {
                environment "DOCKER_HOST", "unix://${dockerRunSocket.absolutePath}"
                environment "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE", dockerRunSocket.absolutePath
            } else if (macDesktopSocket.exists()) {
                environment "DOCKER_HOST", "unix://${macDesktopSocket.absolutePath}"
                environment "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE", macDesktopSocket.absolutePath
            }
        }
    }
}

// eureka-server 모듈 설정
project(':services:eureka-server') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
    }
}

// config-server 모듈 설정
project(':services:config-server') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-config-server'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
    }
}
