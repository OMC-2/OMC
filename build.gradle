plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.omc'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
    }
}

// common 모듈: 일반 jar만 빌드 (bootJar 제외)
project(':common') {
    apply plugin: 'java-library'
}

// 서비스 모듈 공통 설정 (gateway, eureka-server 제외)
def jpaServiceModules = [
    'user-service', 'product-service', 'drop-service',
    'raffle-service', 'order-service', 'payment-service', 'coupon-service', 'notification-service'
]

configure(subprojects.findAll { it.name in jpaServiceModules }) {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        runtimeOnly 'com.mysql:mysql-connector-j'
        implementation project(':common')
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    }
}

// gateway 모듈 설정 (WebFlux 기반 - Spring MVC 불가)
project(':services:gateway') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation project(':common')
    }
}

// eureka-server 모듈 설정
project(':services:eureka-server') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
    }
}
