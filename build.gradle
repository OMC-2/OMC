plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.omc'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.5"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.1"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
        testImplementation project(':arch-rules')
    }

    test {
        useJUnitPlatform()
    }
}

// common 모듈: 일반 jar만 빌드 (bootJar 제외)
project(':common') {
    apply plugin: 'java-library'
}

// arch-rules 모듈: 아키텍처 공통 규칙 (일반 jar)
project(':arch-rules') {
    apply plugin: 'java-library'
    dependencies {
        implementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}

// 서비스 모듈 공통 설정 (gateway, eureka-server 제외)
def jpaServiceModules = [
    'user-service', 'product-service', 'drop-service',
    'raffle-service', 'order-service', 'payment-service', 'coupon-service', 'notification-service'
]

configure(subprojects.findAll { it.name in jpaServiceModules }) {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        runtimeOnly 'org.postgresql:postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation project(':common')
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-starter-config'
    }
}

// gateway 모듈 설정 (WebFlux 기반 - Spring MVC 불가)
project(':services:gateway') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-starter-config'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation(project(':common')) {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
        }
    }
}

// eureka-server 모듈 설정
project(':services:eureka-server') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
    }
}

// config-server 모듈 설정
project(':services:config-server') {
    apply plugin: 'org.springframework.boot'

    bootJar.enabled = true
    jar.enabled = false

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-config-server'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
    }
}
