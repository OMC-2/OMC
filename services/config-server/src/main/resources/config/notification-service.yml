server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/omc?currentSchema=notification_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: notification_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification_db
        jdbc:
          time_zone: Asia/Seoul

  kafka:
    bootstrap-servers: ${KAFKA_URI:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        fetch.min.bytes: 10240
        fetch.max.wait.ms: 1000
    listener:
      ack-mode: manual_immediate
      concurrency: 1
      missing-topics-fatal: false

gateway:
  secret: ${GATEWAY_SECRET:local-secret}

feign:
  client:
    user-service:
      url: ${USER_SERVICE_URL:http://user-service}

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
