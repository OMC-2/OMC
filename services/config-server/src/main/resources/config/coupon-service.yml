server:
  port: 8087
  tomcat:
    accept-count: 2000
    max-connections: 2000

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/omc?currentSchema=coupon_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: coupon_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: coupon_db
        jdbc:
          time_zone: Asia/Seoul
        generate_statistics: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_URI:localhost:9092}
    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: coupon-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
    listener:
      type: batch
      ack-mode: manual_immediate
      missing-topics-fatal: false

logging:
  level:
    org.hibernate.stat: WARN

gateway:
  secret: ${GATEWAY_SECRET:local-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,forcegc
