server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        pool:
          max-connections: 2000
          acquire-timeout: 3000
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimiterKeyResolver}"
                rate-limiter: "#{@userRateLimiter}"
                deny-empty-key: false

        - id: product-service-admin
          uri: lb://product-service
          predicates:
            - Path=/api/v1/admin/products/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimiterKeyResolver}"
                rate-limiter: "#{@productRateLimiter}"
                deny-empty-key: false

        - id: drop-service-admin
          uri: lb://drop-service
          predicates:
            - Path=/api/v1/admin/drops/**

        # 구매 선점 전용 route: drop-service보다 앞에 두어 먼저 매칭
        # dropId 기준 초당 200개 제한 → Tomcat thread pool(200) 이내로 유입 억제
        # 초과 시 429 → RateLimitErrorResponseFilter가 JSON 응답 반환
        - id: drop-purchase
          uri: lb://drop-service
          predicates:
            - Path=/api/v1/drops/*/purchase
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@dropPurchaseKeyResolver}"
                rate-limiter: "#{@dropPurchaseRateLimiter}"

        - id: drop-service
          uri: lb://drop-service
          predicates:
            - Path=/api/v1/drops/**

        - id: raffle-service
          uri: lb://raffle-service
          predicates:
            - Path=/api/v1/raffles/**

        - id: raffle-service-admin
          uri: lb://raffle-service
          predicates:
            - Path=/api/v1/admin/raffles/**

        - id: payment-service-admin
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/admin/payments/**

        - id: order-service-admin
          uri: lb://order-service
          predicates:
            - Path=/api/v1/admin/dlq/**

        - id: product-service-outbox
          uri: lb://product-service
          predicates:
            - Path=/api/v1/admin/outbox-events/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimiterKeyResolver}"
                rate-limiter: "#{@orderRateLimiter}"
                deny-empty-key: false

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimiterKeyResolver}"
                rate-limiter: "#{@paymentRateLimiter}"
                deny-empty-key: false

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/v1/coupons/**

      httpclient:
        pool:
          max-connections: 2000
          pending-acquire-max-count: 4000
          pending-acquire-timeout: 60000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/omc/protocol/openid-connect/certs}
          jwk-set-cache-duration: 3600s
          jwk-set-cache-refresh-duration: 60s

gateway:
  secret: ${GATEWAY_SECRET:local-secret}
  warmup:
    keycloak-token-uri: ${KEYCLOAK_URL:http://keycloak:8180}/realms/omc/protocol/openid-connect/token
    warmup-user-email: ${WARMUP_USER_EMAIL:directtest@test.com}
    warmup-user-password: ${WARMUP_USER_PASSWORD:password123}

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: drop-service
        url: /v3/api-docs/drop-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: raffle-service
        url: /v3/api-docs/raffle-service
      - name: coupon-service
        url: /v3/api-docs/coupon-service
      - name: notification-service
        url: /v3/api-docs/notification-service

logging:
  level:
    org.springframework.cloud.gateway: WARN
