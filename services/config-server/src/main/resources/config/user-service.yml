server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/omc?currentSchema=user_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: user_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_db
        jdbc:
          time_zone: Asia/Seoul

# TODO: JWT 구현 시 실제 시크릿으로 교체 필요. 운영 환경에서는 환경변수로 주입할 것 (${JWT_SECRET})
jwt:
  secret: omc-jwt-secret-key-must-be-at-least-32-characters-long
  access-expiration: 3600000
  refresh-expiration: 604800000

# TODO: 운영 배포 시 환경변수로 주입할 것 (${GATEWAY_SECRET}). user-service-prod.yml에서 오버라이드
gateway:
  secret: local-secret
