server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/omc?currentSchema=user_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: user_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_db
        jdbc:
          time_zone: Asia/Seoul

gateway:
  secret: ${GATEWAY_SECRET:local-secret}

admin:
  secret: ${ADMIN_SECRET:local-admin-secret}

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:omc}
  client-id: ${KEYCLOAK_CLIENT_ID:omc-client}
  admin-username: ${KEYCLOAK_ADMIN:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
