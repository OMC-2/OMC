server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:omc_user;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: omc-jwt-secret-key-must-be-at-least-32-characters-long
  access-expiration: 3600000
  refresh-expiration: 604800000
