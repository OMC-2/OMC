server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/omc?currentSchema=payment_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment_db
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: payment_db

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_URI:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false  # offset 자동 커밋 비활성화
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:com.omc.*}
      retry:
        interval-ms: ${PAYMENT_KAFKA_RETRY_INTERVAL_MS:1000} # consumer 재시도 간격
        max-attempts: ${PAYMENT_KAFKA_RETRY_MAX_ATTEMPTS:3} # 최초 처리 포함 전체 시도 횟수

    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}  # consumer 병렬 처리 개수
      missing-topics-fatal: false  # 토픽이 없어도 서버 다운 X
      ack-mode: manual_immediate  # 처리 성공 후 수동 ack

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true  # producer 재시도 중 중복 적재 최소화
        max.in.flight.requests.per.connection: 5  # idempotence와 함께 안전한 최대 in-flight 요청 수

kafka:
  topic:
    default-partitions: ${KAFKA_TOPIC_DEFAULT_PARTITIONS:3}  # 토픽 기본 파티션 수
    default-replication-factor: ${KAFKA_TOPIC_DEFAULT_REPLICATION_FACTOR:1}  # 토픽 기본 replication factor

gateway:
  secret: local-secret

payment:
  pg:
    mode: ${PAYMENT_PG_MODE:test}
  idempotency:
    processing-ttl-seconds: ${PAYMENT_IDEMPOTENCY_PROCESSING_TTL_SECONDS:600} # 처리 중 락이 영원히 남지 않도록 하는 TTL
    success-ttl-seconds: ${PAYMENT_IDEMPOTENCY_SUCCESS_TTL_SECONDS:86400} # 성공 완료 후 중복 요청을 막아둘 유지 시간
  kafka:
    consumer:
      retry:
        interval-ms: ${PAYMENT_KAFKA_RETRY_INTERVAL_MS:1000} # consumer 재시도 간격
        max-attempts: ${PAYMENT_KAFKA_RETRY_MAX_ATTEMPTS:3} # 최초 처리 포함 전체 시도 횟수
  outbox:
    publisher:
      initial-delay-ms: ${PAYMENT_OUTBOX_INITIAL_DELAY_MS:5000} # 애플리케이션 기동 후 첫 outbox 배치 대기 시간
      fixed-delay-ms: ${PAYMENT_OUTBOX_FIXED_DELAY_MS:5000} # outbox 배치 재실행 주기
      max-retry-count: ${PAYMENT_OUTBOX_MAX_RETRY_COUNT:3} # outbox 발행 최대 재시도 횟수
  toss:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout-ms: ${TOSS_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${TOSS_READ_TIMEOUT_MS:3000}

resilience4j:
  retry:
    instances:
      tossPaymentGateway:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - com.omc.payment.domain.exception.PaymentGatewayConnectionException
        ignore-exceptions:
          - com.omc.payment.domain.exception.PaymentGatewayRequestException