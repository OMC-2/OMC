server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/omc?currentSchema=product_db
    username: ${DB_USERNAME:omc}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: product_db
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: product_db

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_URI:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          drop-service:
            connect-timeout: 1000
            read-timeout: 3000

gateway:
  secret: ${GATEWAY_SECRET:local-secret}

resilience4j:
  circuitbreaker:
    instances:
      drop-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.lang.Exception

logging:
  level:
    com.omc.product: INFO
    com.omc.product.application.scheduler.OutboxPollerScheduler: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF