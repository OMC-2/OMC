spring:
  config:
    import: ""
  main:
    web-application-type: reactive
  cloud:
    config:
      enabled: false
      import-checks:
        enabled: false
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:1
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimiterKeyResolver}"
                rate-limiter: "#{@testRateLimiter}"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/keys

eureka:
  client:
    enabled: false

gateway:
  secret: test-secret
