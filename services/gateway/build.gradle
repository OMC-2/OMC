// gateway 모듈 설정은 루트 build.gradle에서 처리됨
// Spring Cloud Gateway는 WebFlux(Reactive) 기반으로 Spring MVC와 충돌
// → spring-boot-starter-web 대신 spring-cloud-starter-gateway 사용

dependencies {
    // Keycloak JWT 검증 (JWKS 기반, Spring Security OAuth2 Resource Server)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Swagger (WebFlux 기반 Gateway)
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.9'
}
