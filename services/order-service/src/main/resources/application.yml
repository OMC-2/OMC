spring:
  application:
    name: order-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  # LocalDateTime 직렬화 (config-server가 주지 않으므로 여기서 설정)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  health:
    redis:
      enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.0
  ignored-exceptions-for-type: org.springframework.web.context.request.async.AsyncRequestNotUsableException
  environment: development

gateway:
  secret: ${GATEWAY_SECRET:local-secret}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: DEBUG
    com.omc.order.infrastructure.client: DEBUG
    feign: DEBUG