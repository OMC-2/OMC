spring:
  application:
    name: coupon-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  kafka:
    consumer:
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:500}
    producer:
      properties:
        delivery.timeout.ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,forcegc
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
