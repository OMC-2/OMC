spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    # URL/username/password는 @DynamicPropertySource에서 주입
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: coupon_db
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

gateway:
  secret: test-gateway-secret
