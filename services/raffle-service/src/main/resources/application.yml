spring:
  application:
    name: raffle-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
