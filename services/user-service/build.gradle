dependencies {
    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Integration Test — TestContainers 1.21.3 (Docker Desktop 29.x / API 1.44 호환)
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.testcontainers') {
            details.useVersion '1.21.3'
        }
    }
}

test {
    useJUnitPlatform {
        // CI 환경(GitHub Actions 등)에서만 통합 테스트 제외, 로컬에서는 항상 포함
        if (System.getenv('CI') != null) {
            excludeTags 'integration'
        }
    }
    // TestContainers — Docker Desktop 29.x / API 1.44 호환
    systemProperty "api.version", "1.44"
    environment "DOCKER_API_VERSION", "1.44"
    environment "TESTCONTAINERS_RYUK_DISABLED", "true"

    // Mac Docker Desktop 소켓 자동 감지
    // /var/run/docker.sock 없을 때 Docker Desktop 소켓으로 폴백 (개인 설정 불필요)
    def standardSocket = new File('/var/run/docker.sock')
    def macDesktopSocket = new File("${System.getProperty('user.home')}/Library/Containers/com.docker.docker/Data/docker-cli.sock")
    if (!standardSocket.exists() && macDesktopSocket.exists()) {
        environment "DOCKER_HOST", "unix://${macDesktopSocket.absolutePath}"
        environment "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE", macDesktopSocket.absolutePath
    }
}
