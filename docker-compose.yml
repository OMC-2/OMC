version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: omc-postgres
    environment:
      POSTGRES_USER: omc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: on-failure
    networks:
      - omc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omc -d omc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: omc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: on-failure
    networks:
      - omc-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "2181:2181"
    restart: on-failure
    networks:
      - omc-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    restart: on-failure
    networks:
      - omc-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omc-kafka-ui
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: omc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: on-failure
    networks:
      - omc-network


  kafka-rest-proxy:
    image: confluentinc/cp-kafka-rest:7.5.0
    container_name: omc-kafka-rest-proxy
    depends_on:
      - kafka
    ports:
      - "8090:8082"
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      KAFKAREST_HEAP_OPTS: "-Xms128m -Xmx256m"
    restart: on-failure
    networks:
      - omc-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/v3/clusters" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: omc-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/omc?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-omc}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    networks:
      - omc-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8180'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  toss-wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: omc-toss-wiremock
    ports:
      - "18080:8080"
    volumes:
      - ./docker/toss-wiremock/mappings:/home/wiremock/mappings
      - ./docker/toss-wiremock/__files:/home/wiremock/__files
    command:
      - "--global-response-templating"
      - "--verbose"
    restart: on-failure
    networks:
      - omc-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: omc-zipkin
    ports:
      - "19411:9411"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g"
    restart: on-failure
    networks:
      - omc-network

  prometheus:
    image: prom/prometheus:latest
    container_name: omc-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "19090:9090"
    restart: on-failure
    networks:
      - omc-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: omc-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "19121:9121"
    depends_on:
      - redis
    restart: on-failure
    networks:
      - omc-network

  loki:
    image: grafana/loki:latest
    container_name: omc-loki
    ports:
      - "13100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure
    networks:
      - omc-network

  promtail:
    image: grafana/promtail:latest
    container_name: omc-promtail
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: on-failure
    networks:
      - omc-network

  grafana:
    image: grafana/grafana:latest
    container_name: omc-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: on-failure
    networks:
      - omc-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:

networks:
  omc-network:
    driver: bridge
    name: omc-network


